# AI Orchestrator configuration. Copy to orchestrator.config.yaml (or run `orc init`).
# ${VAR} values come from the environment or a .env file next to this file.

node:
  # How this device appears to the others. Defaults to the machine's hostname.
  # name: desktop
  # Remote steps sent to this device run (read-only) in this folder; branch work clones repos here.
  workRoot: ./workspaces
  # Worker devices (e.g. the Linux box, the Mac): set true to take coding steps on their own git
  # branches. They clone your repo, edit, run the tests and push orc/* branches, so this device
  # needs push access to your repos (`gh auth login` or an SSH key). Leave false on the laptop.
  acceptBranchWork: false

server:
  # auto      → loopback only, unless a token is set (then all interfaces)
  # tailscale → this machine's loopback + its Tailscale IP only (recommended for multi-device)
  # or an explicit address such as 0.0.0.0
  host: tailscale
  port: 4317
  # Shared secret. Use the SAME value on every device. Generated by `orc init`.
  token: ${ORC_TOKEN}

dataDir: ./data

brain:
  planner: claude            # who breaks big tasks into steps and merges results
  # plannerModel: opus
  maxParallelSteps: 4
  maxPlanSteps: 8
  defaultPermission: read    # read | edit | full: what agents may do to your files
  stepTimeoutMinutes: 30
  crossReview: true          # reviewers always run on a different model than the author
  learnFromFeedback: true    # thumbs up/down in the UI shift routing

providers:
  # Each CLI uses the account you're logged into. No API keys needed.
  claude:                    # Claude Pro/Max  ·  run `claude`, then /login
    enabled: true
    command: auto
    maxConcurrent: 2
    # model: sonnet          # default for most steps
    # deepModel: opus        # used for system design, reasoning, math, debugging, PCB
  codex:                     # ChatGPT Go/Plus/Pro  ·  `codex login` (Sign in with ChatGPT)
    enabled: true
    command: auto            # auto prefers the Codex desktop app's bundled CLI on Windows
    maxConcurrent: 1         # Go has tight limits; keep low
  gemini:                    # Google AI Pro  ·  install the Antigravity CLI (agy), run `agy` once and sign in
    enabled: true
    command: auto
    maxConcurrent: 2
  perplexity:                # optional: API is billed separately from Pro; research falls back to the others
    apiKey: ${PERPLEXITY_API_KEY}
    model: sonar-pro
    deepModel: sonar-deep-research
    maxConcurrent: 2
  groq:                      # optional, free tier: fast answers for quick questions, task classification, Gmail
    apiKey: ${GROQ_API_KEY}  # console.groq.com/keys; or several: GROQ_API_KEYS=key1,key2 (rotated on limits)
    baseUrl: https://api.groq.com/openai/v1
    model: openai/gpt-oss-120b    # see console.groq.com/docs/models; Groq retires models, so check if calls fail
    deepModel: openai/gpt-oss-120b
    maxConcurrent: 4

branches:                    # coding on git branches across devices ("Branches across devices" / --branches)
  remote: origin
  testCommand: auto          # auto-detects npm/pnpm/yarn test, cargo test, go test, pytest; "" = no tests
  testTimeoutMinutes: 15
  fixAttempts: 1             # if tests fail, the model gets this many tries to fix them before the branch is pushed

memory:
  enabled: true              # every finished run is remembered locally and recalled for related tasks
  recall: 3
  notebooklm:                # optional mirror (unofficial notebooklm-py CLI)
    enabled: false           # uv tool install "notebooklm-py[browser]"; notebooklm login
    notebook: ""             # id from `notebooklm create "AI Orchestrator memory" --json`
    ask: true                # also ask the notebook about each new planned task

actions:                     # what the assistant may do on this device (safe ones run, the rest ask on the phone)
  enabled: true
  roots: []                  # folders it may use, e.g. ["C:/development"]; empty = node.workRoot only
  # safeCommands: [...]      # shell commands that never ask; the default list is read-only (git status, nvidia-smi…)
  safe: []                   # action names that never ask on this device, e.g. ["apps.open"]
  never: []                  # action names always refused here, e.g. ["shell.run"]
  approvalMinutes: 30

sharedMemory:                # one memory pool for every device (AI_Assistant docs/JARVIS.md)
  enabled: true              # this device keeps a full copy in data/shared-memory.db; works offline
  # The Linux machine (BRAIN_TOKEN set) syncs with its brain directly. Every other device: the Linux
  # hub's address here (or MEMORY_HUB in .env), with the same ORC_TOKEN.
  hub: ${MEMORY_HUB}
  pollSeconds: 60

context:
  graphify: auto             # code map of git working folders for the planner (graphify update, offline)
  graphifyTimeoutSeconds: 180

routing:
  # Nudge the built-in capability matrix (0-10) per kind of work, e.g.
  #   pcb_design: { codex: 9 }
  #   ui_ux: { gemini: 9.5 }
  overrides: {}

profile:                     # who the agents work for; part of every agent's live briefing
  # name: Roger              # defaults to OWNER_NAME in .env
  # about: Engineering student in Chennai; building an ESP32 sensor board and this orchestrator.

assistant:                   # the AI_Assistant brain on this machine: its tasks (from Gmail, WhatsApp) go on Today
  url: http://127.0.0.1:8000
  token: ${BRAIN_TOKEN}      # copy BRAIN_TOKEN from AI_Assistant/.env into this .env; unset = off
  pollMinutes: 2

whatsapp:                    # replies in your style (README: WhatsApp); read-only, never sends
  hub: ""                    # on the linked machine: the hub that drafts, e.g. http://100.x.y.z:4317
  history: full              # off | recent | full: history only arrives when you link
  voiceNotes: true
  autoDraft: true            # on the hub: draft when someone messages you
  draftGroups: false
  draftDelaySeconds: 45
  replyProvider: auto        # auto | claude | gemini | codex | groq

style:                       # local models that learn how you write (`orc style learn`)
  model: qwen3:8b            # Ollama
  whisperModel: large-v3-turbo
  minMessages: 15
  maxContacts: 80
  addressTerms: []           # your own nicknames with their spellings, e.g. ["chinna chinnu"]

gmail:                       # today's tasks from your mail; off until `orc gmail connect` (README: Gmail)
  clientFile: gmail-client.json
  pollMinutes: 15
  query: "in:inbox newer_than:2d -category:promotions -category:social -category:forums"
  provider: auto             # model that reads the mail: auto (Groq first) | groq | claude | gemini | codex

tts:                         # Jarvis's voice (POST /api/tts); the phone's own voice speaks when none of these can
  provider: auto             # auto (first of order with a key) | openai | gemini | groq | off
  order: [openai, gemini, groq]
  openai: { voice: onyx }    # OPENAI_API_KEY in .env; model gpt-4o-mini-tts
  gemini: { voice: Charon }  # GEMINI_API_KEY in .env; model gemini-3.8-flash-lite-tts (Interactions API)
  groq: { voice: troy }      # Groq keys above; Orpheus (accept its terms once in the Groq console)

wake:                        # "Hey Jarvis" on this computer's microphone (`orc wake`; needs uv)
  enabled: false             # true: also start it with `orc serve` (the laptop, the Mac mini)
  hub: ""                    # the hub with the brain; empty = sharedMemory.hub / whatsapp.hub / this machine
  threshold: 0.5             # lower wakes more easily (and falsely); `orc wake --threshold 0.4` to try
  followUps: 3               # questions without the wake word before it waits again
  voice: hub                 # hub (its TTS, then this computer's) | system

cluster:
  enabled: true
  tailscale: true            # find other devices running the orchestrator on your tailnet
  peers: []                  # or list them: [http://laptop:4317]
  pollSeconds: 20
  localBias: 0.5             # slight preference for running on this device
